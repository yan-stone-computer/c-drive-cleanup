name: safety tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem .\scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.File, $_.Extent.StartLineNumber, $_.Message)
              }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Run non-destructive safety tests
        shell: powershell
        run: .\scripts\tests\test-lib.ps1

      - name: Verify AllSafe dry-run
        shell: powershell
        run: |
          $reportDir = Join-Path $env:RUNNER_TEMP 'c-drive-cleanup-reports'
          $stdout = Join-Path $env:RUNNER_TEMP 'c-drive-cleanup-clean.json'
          $stderr = Join-Path $env:RUNNER_TEMP 'c-drive-cleanup-clean.err'
          $process = Start-Process powershell -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -ArgumentList @(
              '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\scripts\clean.ps1',
              '-Level', 'safe', '-AllSafe', '-DryRun', '-Json', '-LogDir', $reportDir
            )
          Write-Host "clean.ps1 exit code: $($process.ExitCode)"
          if ($process.ExitCode -notin @(0, 2)) {
            Get-Content -Raw -Encoding UTF8 $stderr
            throw "clean.ps1 exited with $($process.ExitCode)"
          }
          $result = Get-Content -Raw -Encoding UTF8 -LiteralPath $stdout | ConvertFrom-Json
          if ($result.SafetyProfile -ne 'safe-v2+allsafe') { throw 'AllSafe profile was not selected' }

      - name: Verify manual checklist generation
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cleanup-checklist.md'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\guide.ps1 -OutFile $out -TopApps 1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $out)) { throw 'guide.ps1 failed' }
          $text = Get-Content -Raw -Encoding UTF8 -LiteralPath $out
          if ($text -notmatch 'manual-steps\.md' -or $text -notmatch '\-AllSafe') { throw 'manual guidance missing' }

      - name: Validate skill metadata
        shell: powershell
        run: |
          $content = Get-Content -Raw -Encoding UTF8 .\SKILL.md
          if ($content -notmatch '(?s)^---\s*\nname:\s*c-drive-cleanup\s*\n') {
            throw 'Invalid SKILL.md frontmatter'
          }
